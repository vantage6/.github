name: Bug report
description: Report something that does not work as expected. Not for security issues.
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/vantage6/vantage6/security/advisories/new) or email [vantage6@iknl.nl](mailto:vantage6@iknl.nl).
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of vantage6 is affected?
      multiple: true
      options:
        - HQ
        - Node
        - Algorithm store
        - UI
        - CLI / sandbox
        - Python client
        - Algorithm tools
        - Documentation
        - Other / not sure
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, configuration or task input needed to trigger the bug.
      placeholder: |
        1. Start a sandbox with `v6 sandbox new`
        2. Create a task with ...
        3. See error
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `v6 --version`, or the version shown in the UI.
      placeholder: e.g. 5.2.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment type (sandbox, Kubernetes, other), operating system, Docker / Kubernetes version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant HQ, node or algorithm logs. Remove any sensitive data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or anything else that helps.
