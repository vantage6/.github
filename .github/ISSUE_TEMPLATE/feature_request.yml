name: Feature request
description: Suggest new functionality.
type: Feature
labels: [feature-request]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of vantage6 does this concern?
      multiple: true
      options:
        - HQ
        - Node
        - Algorithm store
        - UI
        - CLI / sandbox
        - Python client
        - Algorithm tools
        - Documentation
        - Other / not sure
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who runs into it?
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
